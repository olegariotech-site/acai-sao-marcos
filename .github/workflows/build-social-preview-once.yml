name: Gerar capa social otimizada

on:
  push:
    branches:
      - fix/social-preview-whatsapp

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/social-preview-whatsapp

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar preview e atualizar metadados
        run: python tools/build-social-preview.py

      - name: Validar tamanho e metadados
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('assets/img/acai-do-dudu-link-preview-1200x630-v2.jpg')
          assert p.exists(), 'Preview JPG não foi gerado'
          assert p.stat().st_size <= 550000, f'Preview pesado: {p.stat().st_size}'
          with Image.open(p) as im:
              assert im.size == (1200, 630), f'Dimensões incorretas: {im.size}'
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'acai-do-dudu-link-preview-1200x630-v2.jpg' in html
          assert '<meta property="og:image:type" content="image/jpeg" />' in html
          print(f'Preview OK: {p.stat().st_size} bytes')
          PY

      - name: Commitar capa final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/img/acai-do-dudu-link-preview-1200x630-v2.jpg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "Otimiza capa social para WhatsApp"
          git push origin HEAD:fix/social-preview-whatsapp
