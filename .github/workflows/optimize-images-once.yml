name: Otimizar imagens premium

on:
  push:
    branches:
      - perf/final-image-optimization

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/final-image-optimization

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Gerar WebP preservando PNG original
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          targets = [
              'assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.png',
              'assets/img/produtos/agua-de-coco-dudu-hero.png',
              'assets/img/produtos/pote-tradicional-dudu-2l-hero.png',
              'assets/img/produtos/acai/acai-duplo-tropical-destaque.png',
              'assets/img/produtos/milkshake/trio-acai-e-milkshake-destaque.png',
              'assets/img/produto-milkshake-sabores.png',
              'assets/img/produtos/sorvetes/trio-sobremesas-tropicais.png',
              'assets/img/produtos/acai/acai-origem-garrafas.png',
              'assets/img/produtos/sorvetes/cone-supremo-caldas-escorrendo.png',
              'assets/img/produtos/galeria/trio-colorido-sobremesas-especiais.png',
              'assets/img/produtos/galeria/waffle-bowl-acai-granola-uvas.png',
              'assets/img/fachada/fachada-acai-do-dudu-proposta-ot.png',
              'assets/img/produtos/adicionais/acompanhamentos-extras-2-reais.png',
              'assets/img/produtos/sorvetes/sergel-skimo-85g-sabores-selecionados.png',
              'assets/img/produtos/sorvetes/sergel-2l-iogurte-com-amarena.png',
              'assets/img/produtos/sorvetes/sergel-2l-chocolate-com-pedacos.png',
          ]

          report = []
          for rel in targets:
              src = Path(rel)
              if not src.exists():
                  raise SystemExit(f'Arquivo não encontrado: {rel}')

              with Image.open(src) as original:
                  original.load()
                  width, height = original.size
                  mode = original.mode
                  img = original.copy()

              full = src.with_suffix('.webp')
              img.save(full, 'WEBP', quality=89, method=6, exact=True)

              mobile_width = min(960, width)
              if mobile_width < width:
                  mobile_height = round(height * mobile_width / width)
                  mobile = img.resize((mobile_width, mobile_height), Image.Resampling.LANCZOS)
              else:
                  mobile = img.copy()
                  mobile_height = height

              mobile_path = src.with_name(f'{src.stem}-960.webp')
              mobile.save(mobile_path, 'WEBP', quality=87, method=6, exact=True)

              png_bytes = src.stat().st_size
              webp_bytes = full.stat().st_size
              mobile_bytes = mobile_path.stat().st_size
              report.append({
                  'source': rel,
                  'sourceBytes': png_bytes,
                  'width': width,
                  'height': height,
                  'mode': mode,
                  'webp': str(full),
                  'webpBytes': webp_bytes,
                  'mobileWebp': str(mobile_path),
                  'mobileWidth': mobile_width,
                  'mobileHeight': mobile_height,
                  'mobileBytes': mobile_bytes,
                  'webpSavingPercent': round((1 - webp_bytes / png_bytes) * 100, 1),
                  'mobileSavingPercent': round((1 - mobile_bytes / png_bytes) * 100, 1),
              })

          Path('data/image-optimization.json').write_text(
              json.dumps({'quality': {'desktop': 89, 'mobile': 87}, 'assets': report}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Conectar versões WebP e fallbacks ao site
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest = json.loads(Path('data/image-optimization.json').read_text(encoding='utf-8'))
          mapping = {item['source']: item for item in manifest['assets']}

          catalog_path = Path('data/products.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))

          for product in catalog.get('products', []):
              original = product.get('image')
              item = mapping.get(original)
              if not item:
                  continue
              product['imageFallback'] = original
              product['image'] = item['webp']
              product['imageMobile'] = item['mobileWebp']
              product['imageWidth'] = item['width']
              product['imageMobileWidth'] = item['mobileWidth']

          for gallery_item in catalog.get('gallery', []):
              original = gallery_item.get('src')
              item = mapping.get(original)
              if not item:
                  continue
              gallery_item['fallback'] = original
              gallery_item['src'] = item['webp']
              gallery_item['mobileSrc'] = item['mobileWebp']
              gallery_item['width'] = item['width']
              gallery_item['mobileWidth'] = item['mobileWidth']

          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          js_path = Path('assets/js/site-v2.js')
          js = js_path.read_text(encoding='utf-8')

          media_block = '''  const productImageTemplate = (product, { alt = product.name, className = '', ariaHidden = false } = {}) => {
    const fallback = product.imageFallback || product.image;
    const sourceWidth = Number(product.imageWidth) || 0;
    const mobileWidth = Number(product.imageMobileWidth) || 0;
    const canUseResponsive = product.imageMobile && sourceWidth > 0 && mobileWidth > 0 && mobileWidth < sourceWidth;
    const srcset = canUseResponsive
      ? ` srcset="${escapeHTML(product.imageMobile)} ${mobileWidth}w, ${escapeHTML(product.image)} ${sourceWidth}w" sizes="(max-width: 760px) 92vw, (max-width: 1060px) 48vw, 32vw"`
      : '';
    const classAttr = className ? ` class="${escapeHTML(className)}"` : '';
    const hiddenAttr = ariaHidden ? ' aria-hidden="true"' : '';
    return `<img${classAttr} src="${escapeHTML(product.image)}"${srcset} data-fallback="${escapeHTML(fallback)}" alt="${escapeHTML(alt)}"${hiddenAttr} loading="lazy" decoding="async" />`;
  };

  const productMediaTemplate = (product) => {
    if (product.video) {
      return `
        ${productImageTemplate(product, { alt: '', className: 'product-video-fallback', ariaHidden: true })}
        <video
          src="${escapeHTML(product.video)}"
          poster="${escapeHTML(product.image)}"
          data-fallback="${escapeHTML(product.imageFallback || product.image)}"
          aria-label="Vídeo de ${escapeHTML(product.name)}"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          style="width:100%;height:100%;object-fit:cover;opacity:0;"
        ></video>
      `;
    }

    return productImageTemplate(product);
  };'''

          pattern = re.compile(r"  const productMediaTemplate = \(product\) => \{.*?\n  \};\n\n  const productCardTemplate", re.S)
          js, count = pattern.subn(media_block + '\n\n  const productCardTemplate', js, count=1)
          if count != 1:
              raise SystemExit(f'Não foi possível substituir productMediaTemplate: {count}')

          gallery_block = '''  const renderGallery = () => {
    if (!state.catalog || !elements.galleryGrid) return;
    elements.galleryGrid.innerHTML = state.catalog.gallery.map((item) => {
      const sourceWidth = Number(item.width) || 0;
      const mobileWidth = Number(item.mobileWidth) || 0;
      const canUseResponsive = item.mobileSrc && sourceWidth > 0 && mobileWidth > 0 && mobileWidth < sourceWidth;
      const srcset = canUseResponsive
        ? ` srcset="${escapeHTML(item.mobileSrc)} ${mobileWidth}w, ${escapeHTML(item.src)} ${sourceWidth}w" sizes="(max-width: 760px) 92vw, 40vw"`
        : '';
      return `
        <figure class="gallery-item" data-reveal>
          <img src="${escapeHTML(item.src)}"${srcset} data-fallback="${escapeHTML(item.fallback || item.src)}" alt="${escapeHTML(item.alt)}" loading="lazy" decoding="async" />
        </figure>
      `;
    }).join('');
    observeReveals(elements.galleryGrid);
  };'''

          pattern = re.compile(r"  const renderGallery = \(\) => \{.*?\n  \};\n\n  const listTemplate", re.S)
          js, count = pattern.subn(gallery_block + '\n\n  const listTemplate', js, count=1)
          if count != 1:
              raise SystemExit(f'Não foi possível substituir renderGallery: {count}')

          js = js.replace(
              "elements.modalMedia.dataset.fallback = 'assets/assetslogologo-acai-sao-marcos.png?v=20260815-1';",
              "elements.modalMedia.dataset.fallback = product.imageFallback || 'assets/assetslogologo-acai-sao-marcos.png?v=20260815-1';"
          )
          js = js.replace('video.dataset.fallback = product.image;', 'video.dataset.fallback = product.imageFallback || product.image;')
          js = js.replace(
              "    elements.modalMedia.dataset.mediaFallbackStep = '0';\n    elements.modalMedia.hidden = false;\n    elements.modalMedia.src = product.image;",
              "    elements.modalMedia.dataset.mediaFallbackStep = '0';\n    elements.modalMedia.dataset.fallback = product.imageFallback || 'assets/assetslogologo-acai-sao-marcos.png?v=20260815-1';\n    elements.modalMedia.hidden = false;\n    elements.modalMedia.src = product.image;"
          )
          js_path.write_text(js, encoding='utf-8')

          mobile_path = Path('assets/js/mobile-fixes.js')
          mobile = mobile_path.read_text(encoding='utf-8')
          old = "const fallbackSrc = video.getAttribute('poster') || video.dataset.fallback || PRIMARY_FALLBACK;"
          new = "const fallbackSrc = video.dataset.fallback || video.getAttribute('poster') || PRIMARY_FALLBACK;"
          if old not in mobile:
              raise SystemExit('Fallback de vídeo esperado não encontrado')
          mobile_path.write_text(mobile.replace(old, new, 1), encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              '<link rel="preload" as="image" href="https://acaidodudu.com.br/assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.png?v=20260814-3" fetchpriority="high" />',
              '<link rel="preload" as="image" type="image/webp" href="https://acaidodudu.com.br/assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.webp?v=20260816-webp-1" imagesrcset="https://acaidodudu.com.br/assets/img/produtos/acai/acai-trufado-frutas-crocante-hero-960.webp?v=20260816-webp-1 960w, https://acaidodudu.com.br/assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.webp?v=20260816-webp-1 1122w" imagesizes="(max-width: 760px) 92vw, 50vw" fetchpriority="high" />'
          )
          html = html.replace(
              'src="assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.png?v=20260814-3"\n              data-fallback="assets/img/hero-copo-acai-morango.png?v=20260814-3"',
              'src="assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.webp?v=20260816-webp-1"\n              srcset="assets/img/produtos/acai/acai-trufado-frutas-crocante-hero-960.webp?v=20260816-webp-1 960w, assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.webp?v=20260816-webp-1 1122w"\n              sizes="(max-width: 760px) 92vw, 50vw"\n              data-fallback="assets/img/produtos/acai/acai-trufado-frutas-crocante-hero.png?v=20260814-3"'
          )

          def wire_static_img(text, png, item, sizes):
              needle = f'src="{png}"'
              replacement = (
                  f'src="{item["webp"]}" '
                  f'srcset="{item["mobileWebp"]} {item["mobileWidth"]}w, {item["webp"]} {item["width"]}w" '
                  f'sizes="{sizes}" data-fallback="{png}"'
              )
              if needle not in text:
                  raise SystemExit(f'Imagem estática não encontrada no HTML: {png}')
              return text.replace(needle, replacement, 1)

          static_sizes = {
              'assets/img/produtos/sorvetes/sergel-skimo-85g-sabores-selecionados.png': '(max-width: 760px) 92vw, 30vw',
              'assets/img/produtos/sorvetes/sergel-2l-iogurte-com-amarena.png': '(max-width: 760px) 92vw, 30vw',
              'assets/img/produtos/sorvetes/sergel-2l-chocolate-com-pedacos.png': '(max-width: 760px) 92vw, 30vw',
              'assets/img/produtos/milkshake/trio-acai-e-milkshake-destaque.png': '(max-width: 760px) 92vw, 48vw',
              'assets/img/produtos/adicionais/acompanhamentos-extras-2-reais.png': '(max-width: 760px) 42vw, 22vw',
              'assets/img/fachada/fachada-acai-do-dudu-proposta-ot.png': '(max-width: 760px) 100vw, 62vw',
          }
          for png, sizes in static_sizes.items():
              html = wire_static_img(html, png, mapping[png], sizes)

          html = html.replace('assets/js/site-v2.js?v=20260816-premium-1', 'assets/js/site-v2.js?v=20260816-webp-1')
          html = html.replace('assets/js/mobile-fixes.js?v=20260816-final-audit-1', 'assets/js/mobile-fixes.js?v=20260816-webp-1')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commitar assets e integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img data/image-optimization.json data/products.json assets/js/site-v2.js assets/js/mobile-fixes.js index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "Serve WebP responsivo com fallback PNG"
          git push origin HEAD:perf/final-image-optimization
