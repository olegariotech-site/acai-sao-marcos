name: OT Site Quality Cross-Repo Test
# Evidence pass: actionable axe details
# Architecture pass: diagnostic performance policy
# V0.2 visual readiness rerun after WebKit media settle fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    uses: olegariotech-site/olegariotech-site/.github/workflows/reusable-site-quality.yml@fix/qa-visual-readiness-v0-2
    with:
      serve_dir: "."
      url_path: "/"
      primary_selector: 'a[href*="wa.me"]'
      fail_on_console_errors: false
      strict_axe: true
      stabilize_visual_capture: true
      min_performance: 0.75
      min_accessibility: 0.90
      min_best_practices: 0.85
      min_seo: 0.85
