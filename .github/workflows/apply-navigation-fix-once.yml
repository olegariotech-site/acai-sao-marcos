name: Aplicar correção de navegação

on:
  push:
    branches:
      - fix/notebook-click-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/notebook-click-routing

      - name: Aplicar patch de navegação
        run: python3 tools/apply-navigation-fix.py

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-v2.js assets/js/mobile-fixes.js index.html .github/workflows/media-paths.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "Centraliza clique de categorias e adiciona teste real"
          git push origin HEAD:fix/notebook-click-routing
