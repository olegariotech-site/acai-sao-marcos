name: Optimize quality-test images

on:
  push:
    branches:
      - test/ot-site-quality-cross-repo
    paths:
      - .github/workflows/optimize-quality-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          ref: test/ot-site-quality-cross-repo

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Generate optimized WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs = [
              ("assets/img/hero-copo-acai-morango.png", "assets/img/hero-copo-acai-morango-1280.webp", 1280, 82, False),
              ("assets/assetslogologo-acai-sao-marcos.png", "assets/img/brand/logo-acai-512.webp", 512, 90, True),
              ("assets/img/produtos/picoles-do-dudu-card.png", "assets/img/produtos/picoles-do-dudu-card-960.webp", 960, 82, False),
              ("assets/img/produtos/picoles-sergel-card.png", "assets/img/produtos/picoles-sergel-card-960.webp", 960, 82, False),
          ]

          for src_path, dst_path, max_width, quality, lossless in jobs:
              src = Path(src_path)
              dst = Path(dst_path)
              with Image.open(src) as im:
                  im.load()
                  if im.width > max_width:
                      h = round(im.height * max_width / im.width)
                      im = im.resize((max_width, h), Image.Resampling.LANCZOS)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  kwargs = dict(format="WEBP", method=6)
                  if lossless:
                      kwargs["lossless"] = True
                  else:
                      kwargs["quality"] = quality
                  im.save(dst, **kwargs)
                  print(f"{src} -> {dst}: {src.stat().st_size} -> {dst.stat().st_size} bytes; {im.width}x{im.height}")
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/img/hero-copo-acai-morango-1280.webp             assets/img/brand/logo-acai-512.webp             assets/img/produtos/picoles-do-dudu-card-960.webp             assets/img/produtos/picoles-sergel-card-960.webp
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "perf: add optimized WebP variants for quality gate"
          git push origin HEAD:test/ot-site-quality-cross-repo
