name: OT Site Quality V0.2.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    uses: olegariotech-site/olegariotech-site/.github/workflows/reusable-site-quality.yml@66db8f5169c30b0904667b56c03a8e9d7e8c3549
    with:
      serve_dir: "."
      url_path: "/"
      primary_selector: 'a[href*="wa.me"]'
      strict_axe: true
      fail_on_console_errors: false
      stabilize_visual_capture: true
      enforce_performance: false
      min_performance: 0.75
      min_accessibility: 0.90
      min_best_practices: 0.85
      min_seo: 0.85
