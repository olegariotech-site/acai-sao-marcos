name: Testar capa social publicada

on:
  push:
    branches:
      - fix/social-preview-whatsapp

permissions:
  contents: write

jobs:
  live-social-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/social-preview-whatsapp

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Validar produção como crawler de preview
        run: python tools/check-live-social-preview.py

      - name: Registrar sucesso
        run: |
          printf 'live social preview ok\n' > tools/.live-social-preview-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/.live-social-preview-ok
          git commit -m "Registra validacao ao vivo da capa social"
          git push origin HEAD:fix/social-preview-whatsapp
