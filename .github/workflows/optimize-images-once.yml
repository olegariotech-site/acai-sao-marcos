name: Otimizar imagens premium

on:
  push:
    branches:
      - perf/final-image-optimization

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/final-image-optimization

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Gerar WebP responsivo
        run: python tools/optimize-images.py

      - name: Conectar WebP ao site
        run: python tools/wire-webp.py

      - name: Commitar assets e integracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img data/image-optimization.json data/products.json assets/js/site-v2.js assets/js/mobile-fixes.js index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "Serve WebP responsivo com fallback PNG"
          git push origin HEAD:perf/final-image-optimization
