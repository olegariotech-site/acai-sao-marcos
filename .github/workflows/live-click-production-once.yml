name: Testar cliques no domínio publicado

on:
  push:
    branches:
      - test/live-click-production

permissions:
  contents: read

jobs:
  live-click-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/live-click-production

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Testar produção em notebook
        run: node tools/check-live-browser-navigation.mjs
