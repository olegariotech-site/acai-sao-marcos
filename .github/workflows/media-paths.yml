name: Validar site

on:
  pull_request:
  push:
    branches:
      - main
      - site-premium-v2
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: read

jobs:
  site-validation:
    name: Validação estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validar sintaxe JavaScript
        run: |
          node --check assets/js/site-v2.js
          node --check assets/js/mobile-fixes.js
          node --check assets/js/analytics-consent.js
          node --check assets/js/cardapio-polish.js
          node --check tools/check-cardapio-layout.mjs
          node --check tools/check-media-paths.mjs
          node --check tools/check-interactions.mjs
          node --check tools/check-social-preview.mjs
          node --check tools/check-browser-navigation.mjs

      - name: Validar referências de mídia e catálogo
        run: node tools/check-media-paths.mjs

      - name: Validar segurança, links e interações
        run: node tools/check-interactions.mjs

      - name: Validar capa social
        run: node tools/check-social-preview.mjs

  browser-smoke:
    name: Chromium + Android + iOS WebKit
    needs: site-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar Playwright para o smoke test
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Testar notebook, Android Chrome e iOS Safari WebKit
        run: node tools/check-browser-navigation.mjs

      - name: Validar cardápio e catálogo em todas as telas
        env:
          CARDAPIO_SCREENSHOTS: /tmp/cardapio-qa
          CARDAPIO_LOG_EVIDENCE: '1'
        run: node tools/check-cardapio-layout.mjs

      - name: Guardar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardapio-android-webkit
          path: /tmp/cardapio-qa
          if-no-files-found: ignore
