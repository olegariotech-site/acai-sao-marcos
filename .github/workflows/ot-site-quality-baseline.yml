name: OT Site Quality — Baseline Only (Draft)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: olegariotech-site/olegariotech-site/.github/workflows/reusable-site-quality.yml@195cb9657bf13fefccec886c183a5f19ff3279d3
    with:
      serve_dir: "."
      url_path: "/"
      primary_selector: 'a[href*="wa.me"]'
      strict_axe: true
      fail_on_console_errors: false
      stabilize_visual_capture: true
      enforce_performance: false
      min_performance: 0.75
      min_accessibility: 0.90
      min_best_practices: 0.85
      min_seo: 0.85
