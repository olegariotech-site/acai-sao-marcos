name: Aplicar correção de navegação

on:
  push:
    branches:
      - fix/notebook-click-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/notebook-click-routing

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar patch de navegação
        run: |
          python3 tools/apply-navigation-fix.py
          git checkout -- .github/workflows/media-paths.yml

      - name: Instalar Chromium para teste real
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Testar cliques em notebook e mobile
        run: node tools/check-browser-navigation.mjs

      - name: Commitar correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-v2.js assets/js/mobile-fixes.js index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "Centraliza clique de categorias e valida navegador real"
          git push origin HEAD:fix/notebook-click-routing
